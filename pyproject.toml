[project]
name = "masterba"
version = "0.0.1"
description = "Multi-agent system generating and maintaining IPA V-Waterfall deliverables (BRD/SRS/Basic/Detail Design + tests) as Excel"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "deepdiff>=7.0",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3", "lancedb>=0.13", "huggingface-hub>=0.24"]

[project.scripts]
masterba = "masterba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterba"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-networkx>=3.6.1.20261029",
    "types-openpyxl>=3.1.5.20261017",
    "httpx>=0.28.1",
    "hypothesis>=6.100",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".kiro"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov --cov-report=term-missing -m 'not live and not rag_eval'"
markers = [
    "live: calls the real model; needs ANTHROPIC_API_KEY (run with -m live)",
    "rag_eval: retrieval quality eval; needs the rag extra and the model (run with -m rag_eval)",
    "slow: measured slow (pytest --durations); skipped by the quick CI job",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
