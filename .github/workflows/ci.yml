# Continuous integration (spec 11 section 4). The live marker is excluded everywhere.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.28"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: git config --global user.name CI && git config --global user.email ci@localhost
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not slow and not live" --no-cov

  full:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.28"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: git config --global user.name CI && git config --global user.email ci@localhost
      - run: uv run pytest

  image:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t masterba:ci --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" .
      - name: Smoke test as the non-root user
        run: |
          work="$RUNNER_TEMP/work"; mkdir "$work"
          env=(-e GIT_AUTHOR_NAME=CI -e GIT_AUTHOR_EMAIL=ci@localhost -e GIT_COMMITTER_NAME=CI -e GIT_COMMITTER_EMAIL=ci@localhost)
          docker run --rm "${env[@]}" -v "$work:/work" masterba:ci doctor --init
          docker run --rm "${env[@]}" -v "$work:/work" masterba:ci init-project --project PRJ-001
          test "$(git -C "$work" log -1 --format=%an)" = CI
          test "$(docker run --rm --entrypoint id masterba:ci -u)" != 0
      - name: No key in the image
        run: |
          if docker history --no-trunc masterba:ci | grep -E 'ANTHROPIC_API_KEY=[^ "]'; then exit 1; fi
          found="$(docker run --rm --entrypoint sh masterba:ci -c 'find / -xdev -name .env 2>/dev/null || true')"
          test -z "$found" || { echo "found: $found"; exit 1; }
      - name: Default image has no rag packages (spec 12)
        run: |
          if docker run --rm --entrypoint python masterba:ci -c 'import lancedb'; then exit 1; fi
          docker run --rm --entrypoint sh masterba:ci -c 'test "$HF_HOME" = /models'
      - run: docker build -t masterba:rag --build-arg EXTRAS=rag --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" .
      - name: The rag image passes the extra check and ships no model weights
        run: |
          docker run --rm --entrypoint python masterba:rag -c 'from masterba.knowledge.embedder import rag_available; assert rag_available()'
          for image in masterba:ci masterba:rag; do
            found="$(docker run --rm --entrypoint sh "$image" -c 'find /models /app/.venv -xdev \( -name "*.safetensors" -o -name "*.bin" \) -size +10M 2>/dev/null || true')"
            test -z "$found" || { echo "$image: $found"; exit 1; }
          done
      - name: Compose mounts the model cache at HF_HOME
        run: |
          docker compose config | grep -E 'source: model-cache|target: /models'
